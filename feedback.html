<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <title>Feedback Form</title> 
</head> 
<body> 
    <h2>Feedback Form</h2> 
    <form action="#" method="post"> 
        <label>Name:</label><br> 
        <input type="text" 
               name="name"> 
        <br><br> 
        <label>Rate our service:</label> 
        <select name="rating"> 
            <option>Excellent</option> 
            <option>Good</option> 
            <option>Average</option> 
            <option>Poor</option> 
        </select> 
        <br><br> 
        <label>Comments:</label><br> 
        <textarea name="comments" 
                  rows="4" 
                  cols="40"></textarea> 
        <br><br> 
        <input type="submit" 
               value="Submit Feedback"> 
    </form> 
</body> 
</html>
